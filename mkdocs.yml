site_name: nightwright
site_description: Passive time tracking plus a spec-first agentic pipeline, from idea to shipped work
site_url: https://brunosmmm.github.io/nightwright/
docs_dir: docs/product
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue grey
      accent: teal

extra_css:
  - assets/css/extra.css

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Start here:
      - Bootstrap from zero: guides/bootstrap.md
      - Getting started: guides/getting-started.md
      - Run the agentic loop: guides/agentic-workflow.md
  - Ideas to specs:
      - ideas/index.md
      - Capture ideas: ideas/capture.md
      - Explore until it's ready: ideas/explore.md
      - Write a spec the loop can build: ideas/spec.md
  - The agentic loop:
      - How it works: loop/index.md
      - Principles: loop/principles.md
      - The state machine: loop/states.md
      - Convergence & escalation: loop/convergence.md
      - Operating the loop: loop/operate.md
  - Everyday use:
      - guides/index.md
      - Daily ops: guides/daily-ops.md
      - Weekly ops: guides/weekly-ops.md
      - Idea → ship (by hand): guides/idea-to-ship.md
      - Track time: guides/track-time.md
      - Multi-project: guides/multi-project.md
      - Outbound: guides/outbound.md
      - Org-mode storage: guides/org-storage.md
      - Agent surface: guides/agent-surface.md
  - Concepts:
      - concepts/index.md
      - Storage architecture: concepts/architecture.md
      - Lifecycle & DoD: concepts/lifecycle.md
      - Default portable (nw-native): concepts/portable-default.md
      - Workflow architecture: concepts/workflows.md
      - Time model & retention: concepts/time-and-retention.md
  - Reference:
      - Commands: reference/index.md
      - Capabilities:
          - capabilities/index.md
          - Agentic loop: capabilities/agentic.md
          - Ideas & next: capabilities/ideas.md
          - Skills: capabilities/skills.md
          - Projects & outbound: capabilities/projects.md
