# nightwright's own agentic project configuration (SPEC-0177; schema SPEC-0170).
# Gates are the repo's DoD commands; policy is merge-to-main after rebase + re-gate.
schema: nw.project.v1
project: Meta-Tools
base: main
gates:
  # spec-lint first (SPEC-0214 park 2026-10-26): it regenerates the ledger, so pytest's ledger
  # staleness test sees a fresh block after any rebase.
  - name: spec-lint
    # Regenerate the generated ledger block first: it is derived from frontmatter, so an
    # implementer that edited a spec but forgot --write-ledger must not fail the gate for it.
    # On a remote worker (SPEC-0338) the regenerated ledger would stay in the worker's checkout:
    # the worker reports the change and the run is re-run locally, which rewrites it here.
    cmd: python3 tools/spec_lint.py --write-ledger >/dev/null && python3 tools/spec_lint.py
    timeout_s: 120
    required: true
  # SPEC-0328: tiered gates. The fix loop (GATING after implement / each fix) runs only the
  # tests the branch affects (static import graph, tools/affected_tests.py; it falls back to the
  # full suite when selection is unsafe) plus a ~1 s config smoke set; the full suite runs once,
  # in the close re-gate on the rebased tree.
  - name: pytest-affected
    when: loop
    # A worktree branched before SPEC-0328 has no tools/affected_tests.py (the gate list comes
    # from main's project.yaml): run the full suite there instead of failing (IDEA-533, 2026-10-31).
    # SPEC-0421: --guards runs the tree guards on every selection; the loop runs in the un-rebased
    # worktree, whose tool may predate the flag, so it is passed only when the tool knows it.
    cmd: >-
      if [ -f tools/affected_tests.py ]; then
      python3 tools/affected_tests.py --help | grep -q -- --guards && G=--guards || G=;
      python3 tools/affected_tests.py --help | grep -q -- --exclude-marks
      && X=--exclude-marks=integration,tui,remote,perf || X=;
      python3 tools/affected_tests.py $G $X
      --include tests/test_agentic_dogfood_config.py --include tests/test_agentic_project.py
      --run uv run pytest -q -x -n 2;
      else uv run pytest -q -x -n 2; fi
    retry_cmd: uv run pytest -q -n 0 -m "not (integration or tui or remote or perf) or tree_guard" {failing}
    # SPEC-0358: a round after a red one reruns the previous failing ids first
    failed_first: true
    results: {format: pytest}
    # the fallback is the full suite, so the full suite's limit. SPEC-0490: the fast tier needs
    # 1386 (1.5 x GATEJOB-1342's 924 s), but a full_suite campaign runs every tier here.
    timeout_s: 2400
    required: true
    retries: 2
  # SPEC-0350: per-gate path sensitivity. At the close re-gate a gate with `paths` runs only when
  # the branch changes a path matching one of its globs; spec-lint has none and always runs.
  # `docs-tests` covers what docs-only changes can break (SPEC-0350 Design lists the evidence);
  # the full suite is skipped for a branch that touches only README.md / mkdocs.yml / docs/**
  # (minus the few docs files other tests read, listed below). When unsure, a path is in `pytest`.
  - name: docs-tests
    when: close
    cmd: >-
      uv run pytest -q -n 2 tests/test_docs_*.py tests/test_spec_lint*.py tests/test_specs.py
      tests/test_agentic_profiles.py
    retry_cmd: uv run pytest -q -n 0 {failing}
    results: {format: pytest}
    timeout_s: 900
    required: true
    retries: 1
    paths: ["README.md", "mkdocs.yml", "docs/**", "skills/**", "scripts/**", ".github/**"]
  - name: pytest
    when: close
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "skills/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".nw/**"
      - "AGENTS.md"
      - "scripts/**"
      - ".github/**"
      # docs files other (non-docs) tests read: spec scaffolding/schema, examples, workflow doc
      - "docs/specs/SCHEMA.md"
      - "docs/specs/spec.schema.json"
      - "docs/specs/TEMPLATE*.md"
      - "docs/specs/0003-*.md"    # test_completion copies the real 0003/0004 specs
      - "docs/specs/0004-*.md"
      - "docs/examples/**"
      - "docs/WORKFLOW.md"
    # SPEC-0359: skipped when the rebase is clean (rules R1-R7) and the last green
    # pytest-affected round stands for it.
    reuse_from: pytest-affected
    # SPEC-0378: the close gate runs only the tests the branch affects (affected_tests.py
    # against merge-base($NW_BASE, HEAD), narrowed fallbacks, no fraction cap); the full
    # suite runs only as the main sentinel (SPEC-0379, interval agentic.sentinel.interval_hours),
    # which affected_tests.py detects (NW_CAMPAIGN sentinel-*) and runs in full.
    # SPEC-0309: 4 xdist workers (8 cores / 2 gate slots); the targeted rerun stays serial.
    # SPEC-0421: --guards adds the tree_guard modules (tests that scan the tests/src tree) to every
    # non-full selection, so a guard that landed on main after the branch was cut still runs.
    cmd: >-
      python3 tools/affected_tests.py --guards
      --exclude-marks integration,tui,remote,perf
      --include tests/test_agentic_dogfood_config.py --include tests/test_agentic_project.py
      --run uv run pytest -q -x -n 4
    retry_cmd: uv run pytest -q -n 0 -m "not (integration or tui or remote or perf) or tree_guard" {failing}
    results: {format: pytest}
    # the sentinel's full suite takes 13-19 min alone and timed out under concurrent gates at
    # 1200 (2026-10-30, SPEC-0302/0304, IDEA-412/415); a remaining full fallback needs it too.
    # SPEC-0490: the fast tier needs 1671 (1.5 x GATEJOB-1341's 1113.8 s); the sentinel runs
    # every tier through this gate (NW_ALL_TIERS), so the all-tier limit stays.
    timeout_s: 2400
    required: true
    # SPEC-0289: a failing run re-runs its failing ids, then the selection once more, before triage.
    retries: 2
merge:
  policy: merge
  base: main
  push_after_merge: false
  delete_branch: true
  # Generated files: a rebase conflict touching only these is resolved by regenerating (SPEC-0191).
  regenerate:
    - path: docs/LEDGER.md
      cmd: python3 tools/spec_lint.py --write-ledger
  # SPEC-0234: paths no gate reads, so `nw queue merge --docs-only` may skip the gates. docs/specs/,
  # docs/LEDGER.md, docs/product/, README.md, skills/ and persona prompts are read by spec-lint or
  # pytest and stay out. A test that starts reading one of these must remove it from this list.
  docs_only_paths:
    - docs/design/
    - docs/WORKFLOW.md
worktrees:
  setup:
    - uv sync
  cleanup: on_merge
agents:
  context_files:
    - AGENTS.md
    - docs/specs/SCHEMA.md
  allowed_tools:
    - "Bash(uv run nw *)"
    - "Bash(nw *)"
    - "Bash(git status*)"
    - "Bash(git diff*)"
    - "Bash(git log*)"
