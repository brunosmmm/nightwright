# SPEC-0436: alias + effort → Cursor model id. Overlay with
# <config_dir>/cursor_map.yaml, agentic.cursor in config.yaml, or
# <project>/.nw/cursor_map.yaml. A profile persona may also set cursor_model.
schema: nw.cursor_map.v1
defaults:                 # effort when the profile's effort is missing or unknown
  haiku: medium
  sonnet: high
  opus: high
aliases:
  haiku:
    low: grok-4.7-low
    medium: grok-4.7-low
    high: grok-4.7-medium
    xhigh: grok-4.7-medium
    max: grok-4.7-medium
  sonnet:
    low: grok-4.7-medium
    medium: grok-4.7-medium
    high: grok-4.7-high
    xhigh: grok-4.7-xhigh
    max: grok-4.7-xhigh
  opus:
    low: gpt-5.6-sol-medium
    medium: gpt-5.6-sol-medium
    high: gpt-5.6-sol-high
    xhigh: gpt-5.6-sol-xhigh
    max: gpt-5.6-sol-xhigh
