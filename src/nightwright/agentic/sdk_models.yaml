# SPEC-0446. Account catalog from Cursor.models.list() on 2026-11-07.
# effort_param is the SDK parameter that carries the effort. efforts are the
# values that parameter accepts. A model with neither has no effort knob;
# a trailing -high on that id is dropped and the bare id is sent.
# SPEC-0460. `fast: false` is set only on grok and composer. The spawn always
# sends false for those; the key is presence, not a switch that can be turned on.
schema: nw.sdk_models.v1
