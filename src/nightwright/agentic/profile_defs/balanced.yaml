schema: nw.profile.v1
description: "default mix: sonnet implements, opus reviews"
slots: 2
loop_max: 3
campaign_cap_usd: 10.0
run_timeout_s: 1800
reviewers: [conformance_reviewer, test_reviewer, adversarial_reviewer]
review:
  pass_score: 80
  weights: {must_fix: 100, major: 15, minor: 4, nit: 1}
  triager: true
  followups: true
  followups_nits: false
  followups_max: 10
personas:
  implementer:
    {model: sonnet, effort: high, max_budget_usd: 4.0,
     permission_mode: bypassPermissions, read_only: false}
  conflict_resolver:
    {model: sonnet, effort: high, max_budget_usd: 2.0,
     permission_mode: bypassPermissions, read_only: false}
  gate_triager:
    {model: sonnet, effort: medium, max_budget_usd: 0.5,
     permission_mode: dontAsk, read_only: true}
  conformance_reviewer:
    {model: opus, effort: high, max_budget_usd: 1.5,
     permission_mode: dontAsk, read_only: true}
  test_reviewer:
    {model: opus, effort: high, max_budget_usd: 1.0,
     permission_mode: dontAsk, read_only: true}
  adversarial_reviewer:
    {model: opus, effort: high, max_budget_usd: 1.5,
     permission_mode: dontAsk, read_only: true}
  spec_reviewer:
    {model: sonnet, effort: high, max_budget_usd: 0.8,
     permission_mode: dontAsk, read_only: true}
  spec_writer:
    {model: sonnet, effort: high, max_budget_usd: 1.5,
     permission_mode: bypassPermissions, read_only: false}
  review_triager:
    {model: sonnet, effort: medium, max_budget_usd: 0.5,
     permission_mode: dontAsk, read_only: true}
