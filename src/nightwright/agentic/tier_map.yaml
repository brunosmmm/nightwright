# SPEC-0553: role tier -> concrete model per backend, used only when a campaign pinned
# `agentic.lean.tiers` on at open. Overlay with <config_dir>/tier_map.yaml, agentic.tiers in
# config.yaml, or <project>/.nw/tier_map.yaml (lowest first; mappings merge key by key).
# claude: a claude-* id (or alias) and its --effort. cursor: a Cursor base id; the effort
# becomes that model's effort parameter (sdk_models.yaml). pi: provider/id; effort = thinking.
# SPEC-0553 As shipped records the real call made for each row. claude and pi rows replied
# (2026-11-11). cursor rows: to be confirmed (cursor-agent accepted the ids but the account
# was at its weekly usage limit, so no reply yet).
schema: nw.tier_map.v1
claude:
  marshal: {model: claude-haiku-5-5, effort: medium}
  judge: {model: claude-sonnet-5-5, effort: high}
  deep: {model: claude-opus-5-5, effort: high}
cursor:
  marshal: {model: grok-4.7, effort: low}
  judge: {model: grok-4.7, effort: high}
  deep: {model: gpt-5.6-sol, effort: high}
pi:
  marshal: {model: openai/gpt-5.6-luna, effort: medium}
  judge: {model: openai/gpt-5.6-sol, effort: high}
  deep: {model: openai/gpt-6.1-terra, effort: high}
