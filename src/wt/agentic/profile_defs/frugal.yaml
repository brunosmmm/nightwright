schema: wt.profile.v1
description: "cheap mix: one reviewer, small caps, haiku triagers"
slots: 1
loop_max: 2
campaign_cap_usd: 3.0
run_timeout_s: 1200
reviewers: [conformance_reviewer]
review:
  pass_score: 70
  weights: {must_fix: 100, major: 15, minor: 4, nit: 1}
  triager: false
  followups: true
  followups_nits: false
  followups_max: 10
personas:
  implementer:
    {model: sonnet, effort: medium, max_budget_usd: 1.5,
     permission_mode: bypassPermissions, read_only: false}
  conflict_resolver:
    {model: sonnet, effort: medium, max_budget_usd: 1.0,
     permission_mode: bypassPermissions, read_only: false}
  gate_triager:
    {model: haiku, effort: medium, max_budget_usd: 0.25,
     permission_mode: dontAsk, read_only: true}
  conformance_reviewer:
    {model: sonnet, effort: medium, max_budget_usd: 0.6,
     permission_mode: dontAsk, read_only: true}
  test_reviewer:
    {model: sonnet, effort: medium, max_budget_usd: 0.5,
     permission_mode: dontAsk, read_only: true}
  adversarial_reviewer:
    {model: sonnet, effort: medium, max_budget_usd: 0.6,
     permission_mode: dontAsk, read_only: true}
  spec_reviewer:
    {model: sonnet, effort: medium, max_budget_usd: 0.4,
     permission_mode: dontAsk, read_only: true}
  spec_writer:
    {model: sonnet, effort: medium, max_budget_usd: 0.8,
     permission_mode: bypassPermissions, read_only: false}
  review_triager:
    {model: haiku, effort: medium, max_budget_usd: 0.25,
     permission_mode: dontAsk, read_only: true}
