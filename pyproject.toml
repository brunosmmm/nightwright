[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightwright"
version = "0.1.0"
description = "Passive time tracking from Claude Code / Cursor transcripts and Outlook meetings, plus a spec-first agentic pipeline from idea to shipped work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8",
    "rich>=13",
    "pyyaml>=6",
    "orgparse>=0.4",
    # SPEC-0368: the interactive desk (`nw tui`) is a core dependency. As an opt-in extra
    # (SPEC-0099) it was dropped by any plain `uv run`/`uv sync` (the remote worker's gate
    # tree), and the TUI tests failed collection with ModuleNotFoundError: textual.
    "textual>=8,<9",
]

[project.optional-dependencies]
# SPEC-0368: textual is now a core dependency; `tui` stays as an empty alias so existing
# `uv sync --extra tui` / `'.[tui]'` installs keep working.
tui = []
# SPEC-0143: product docs site (`mkdocs.yml` → docs/product/).
docs = ["mkdocs-material>=9"]

[project.scripts]
nw = "nightwright.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    # SPEC-0309: nightwright's own pytest gate runs `-n 4` under the host-wide gate-slot pool.
    "pytest-xdist>=3",
    "jsonschema>=4",
    # SPEC-0115: a terminal emulator, so a test can assert what a REAL terminal renders. Textual
    # repaints incrementally, so you cannot reconstruct a screen from raw pty bytes by picking a
    # frame — which is how a broken tree mode passed headless pilots and shipped.
    "pyte>=0.8",
    # SPEC-0143: strict docs build in CI / local pytest.
    "mkdocs-material>=9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nightwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real nested pytest/xdist process (SPEC-0392)"]
